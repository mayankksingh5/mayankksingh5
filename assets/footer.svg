<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84" role="img" aria-label="Thanks for visiting">
  <defs>
    <clipPath id="card">
      <rect width="1200" height="84" rx="16" />
    </clipPath>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07" />
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="84" fill="#0a0b0f" />
    <rect width="1200" height="84" fill="url(#dots)" />
    <rect width="1200" height="3" fill="url(#brand)" />
  </g>
  <rect x="0.5" y="0.5" width="1199" height="83" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" />
  <text x="600" y="50" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'SF Mono', Menlo, 'Courier New', monospace" font-size="16"><tspan fill="#06b6d4">$</tspan><tspan fill="#9ca3af"> echo "thanks for visiting, let's build something reliable"</tspan></text>
</svg>
