<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Mayank Kumar Singh, Associate DevOps Engineer and Software Developer">
  <defs>
    <clipPath id="card">
      <rect width="1200" height="320" rx="20" />
    </clipPath>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07" />
    </pattern>
    <radialGradient id="glowBlue">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.38" />
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.28" />
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#b8c0cc" />
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', Consolas, 'SF Mono', Menlo, 'Courier New', monospace; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#0a0b0f" />
    <rect width="1200" height="320" fill="url(#dots)" />
    <circle cx="170" cy="30" r="300" fill="url(#glowBlue)" />
    <circle cx="1120" cy="320" r="320" fill="url(#glowCyan)" />
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" />

  <!-- Left: intro -->
  <text x="64" y="92" class="mono" font-size="18" fill="#3b82f6">// hi there, i'm</text>
  <text x="62" y="158" class="sans" font-size="60" font-weight="800" fill="url(#nameGrad)">Mayank Kumar Singh</text>
  <rect x="64" y="178" width="96" height="4" rx="2" fill="url(#brand)" />
  <text x="64" y="220" class="sans" font-size="22" fill="#9ca3af">Associate DevOps Engineer · Software Developer</text>

  <g class="mono" font-size="14" text-anchor="middle">
    <rect x="64" y="246" width="78" height="30" rx="8" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.35" />
    <text x="103" y="266" fill="#60a5fa">DevOps</text>
    <rect x="152" y="246" width="70" height="30" rx="8" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.35" />
    <text x="187" y="266" fill="#60a5fa">Cloud</text>
    <rect x="232" y="246" width="70" height="30" rx="8" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-opacity="0.35" />
    <text x="267" y="266" fill="#22d3ee">CI/CD</text>
    <rect x="312" y="246" width="112" height="30" rx="8" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-opacity="0.35" />
    <text x="368" y="266" fill="#22d3ee">Automation</text>
  </g>

  <!-- Right: terminal -->
  <rect x="780" y="36" width="356" height="248" rx="14" fill="#111318" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.1" />
  <circle cx="802" cy="58" r="5" fill="#ef4444" fill-opacity="0.7" />
  <circle cx="822" cy="58" r="5" fill="#eab308" fill-opacity="0.7" />
  <circle cx="842" cy="58" r="5" fill="#22c55e" fill-opacity="0.7" />
  <text x="970" y="62" class="mono" font-size="13" fill="#7b8290" text-anchor="middle">mayank@devops: ~</text>
  <line x1="780" y1="78" x2="1136" y2="78" stroke="#ffffff" stroke-opacity="0.08" />

  <g class="mono" font-size="15">
    <text x="800" y="108"><tspan fill="#06b6d4">$</tspan><tspan fill="#e8eaf0"> whoami</tspan></text>
    <text x="800" y="134" fill="#9ca3af">devops-engineer</text>
    <text x="800" y="160"><tspan fill="#06b6d4">$</tspan><tspan fill="#e8eaf0"> cat stack.txt</tspan></text>
    <text x="800" y="186" fill="#9ca3af">docker k8s aws jenkins linux</text>
    <text x="800" y="212"><tspan fill="#06b6d4">$</tspan><tspan fill="#e8eaf0"> echo $STATUS</tspan></text>
    <text x="800" y="238" fill="#10b981">● open to opportunities</text>
    <text x="800" y="264" fill="#06b6d4">$</text>
    <rect x="816" y="251" width="9" height="17" fill="#e8eaf0">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
